name: mi_puesto
description: "Punto de venta sencillo para un puesto: vender, cobrar y consultar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Las dos tipografías del diseño. Son fuentes variables: un solo archivo
  # cubre todos los grosores (ver lib/nucleo/tema/tipografia.dart).
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fuentes/Figtree.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fuentes/BricolageGrotesque.ttf
